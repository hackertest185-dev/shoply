services:
  - type: web
    name: shoply-api
    runtime: docker
    rootDir: backend
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: shoply
      - key: REDIS_URL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Shoply
      - key: ADMIN_MFA_REQUIRED
        value: "true"
      - key: ADMIN_MFA_TTL_SECONDS
        value: "300"
      - key: ADMIN_MFA_MAX_ATTEMPTS
        value: "5"
      - key: ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10"
      - key: ADMIN_REFRESH_TOKEN_EXPIRE_DAYS
        value: "1"
      - key: PASSWORD_MIN_LENGTH
        value: "12"
